{% extends "registration/base_conta.html" %}

{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
  <h1>Criar conta</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
